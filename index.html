
<!DOCTYPE html>
<html lang="fr">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">

    <title>ASCENSION</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>ASCENSION</h1>
        <p>Classement des dessinateurs</p>
    </header>

    <a href="reglement.html" class="rules-button">
    Règlement
</a>

    <main>
        <section class="ranking">
            <h2>Classement</h2>

            <div id="ranking-list">
                <!-- Les membres seront affichés ici par JavaScript -->
            </div>
        </section>
    </main>


<!-- PANNEAU DU MEMBRE -->
<div id="member-modal" class="modal">

    <div id="member-card" class="modal-content">

        <button id="close-modal" class="close-modal">×</button>

        <h2 id="modal-username">Pseudo</h2>

        <div class="member-info">

    <p>
        Classe :
        <span id="modal-class"></span>
    </p>

    <p>
        Points :
        <span id="modal-points"></span>
    </p>

    <p>
        Victoires :
        <span id="modal-wins"></span>
    </p>

    <p>
        Défaites :
        <span id="modal-losses"></span>
    </p>

</div>

<p class="instagram-row">
    Instagram :
    <a id="modal-instagram"
       href="#"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
        <svg class="instagram-icon"
             viewBox="0 0 24 24"
             aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
    </a>
</p>

<h3>Dessins</h3>

<div id="modal-drawings">
    Chargement...
</div>

<h3>Historique des duels</h3>

        <div id="modal-history">
            Aucun duel enregistré.
        </div>

    </div>

</div>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
